name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "*.*.*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io

permissions:
  packages: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs no authenticated git operations, so there is no need to
          # leave the checkout token in the local git config.
          persist-credentials: false

      # Linting and formatting are version-independent, so they run once here
      # instead of being repeated across the `validate` matrix.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit --forceExit --detectOpenHandles
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results

      - name: Build TypeScript
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: ./test-results/junit.xml
          if-no-files-found: warn

  e2e:
    # Runs the shipped build against a real Home Assistant and a real broker.
    # See test/e2e/README.md for what the scenarios cover.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Installing Home Assistant takes far longer than running the scenarios,
      # and the pinned versions only change when someone edits versions.json.
      - name: Cache the Home Assistant environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/e2e/.venv-ha
          key: ha-venv-${{ runner.os }}-py3.13-${{ hashFiles('test/e2e/versions.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Home Assistant
        run: npm run e2e:setup

      - name: Run end-to-end scenarios
        run: npm run test:e2e -- --ci

      # The Home Assistant log is the evidence for any failure here.
      - name: Upload scenario logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-logs
          path: |
            test/e2e/.tmp/**/home-assistant.log
            test-results/junit-e2e.xml
          if-no-files-found: warn

  test-addon:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build test Docker image
        run: |
          docker build -t hm2mqtt-test -f ha_addon/Dockerfile .

      - name: Run addon tests
        run: npm run test:addon

  images:
    needs: [lint, validate, test-addon, e2e]
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      checkout-ref: ${{ github.sha }}
      push: ${{ github.event_name != 'pull_request' }}
      tag-latest: ${{ github.ref == 'refs/heads/main' }}
      tag-next: ${{ github.ref == 'refs/heads/develop' }}
      semver: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
