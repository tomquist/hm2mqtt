configuration:
  pollingInterval:
    name: Polling Interval
    description: "Interval in seconds between device status polls (default: 60)"
  responseTimeout:
    name: Response Timeout
    description: "Timeout in seconds for device responses before considering the device to be offline (default: 30)"
  enableCellData:
    name: Enable Cell Data
    description: "Enable cell voltage data (B2500, Greensolar, Venus and Jupiter). On Venus it also adds detailed per-pack BMS data"
  enableCalibrationData:
    name: Enable Calibration Data
    description: "Enable calibration data reporting (B2500 and Greensolar storage only)"
  enableExtraBatteryData:
    name: Enable Extra Battery Data
    description: "Enable extra battery data reporting (B2500 and Greensolar storage only)"
  enableCellBalancingDiagnostics:
    name: Enable Cell Balancing Diagnostics (experimental)
    description: "Experimental: which sensors exist, and the thresholds behind them, may still change between releases. Enables cell balancing analysis, measuring the cell spread at the same point of every charge so it can be compared between days. Requires cell data (B2500, Greensolar and Venus)"
  allowedConsecutiveTimeouts:
    name: Allowed Consecutive Timeouts
    description: "Number of consecutive timeouts before a device is marked offline (default: 3)"
  topicPrefix:
    name: MQTT Topic Prefix
    description: "Base MQTT topic prefix for published data (default: hm2mqtt)"
  autodiscoveryTopicPrefix:
    name: MQTT Auto Discovery Topic Prefix
    description: "Base MQTT topic prefix for Home Assistant auto discovery topics (default: homeassistant)"
  mqttProxyEnabled:
    name: Enable MQTT Proxy
    description: "Enable MQTT proxy server to resolve B2500 client ID conflicts (default: false)"
  log_level:
    name: Log Level
    description: "Verbosity of application logs (default: info)"
  devices:
    name: Devices
    description: "List of energy storage devices to connect to. For each device, specify: deviceType (e.g. HMA-1 for B2500 v2, HMB-1 for B2500 v1, HMG-50, VNSE3-0, VNSA-1, VNSD-1, or VNSEMINI-0 for Venus), deviceId (12-character MAC address from app, not WiFi MAC)"
network:
  1890/tcp: "Port for the MQTT proxy server (default: 1890)"